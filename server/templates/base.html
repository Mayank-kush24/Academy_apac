<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>{% block title %}Gen AI Academy APAC{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/dashboard-enterprise.css">
    <link rel="stylesheet" href="/static/css/dashboard-boutiq.css">
    <link rel="stylesheet" href="/static/css/dashboard-premium.css">
    <link rel="stylesheet" href="/static/css/liquid-glass.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=Google+Sans+Display:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-container">
        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>
                    <i class="fas fa-graduation-cap" style="margin-right: 8px; color: var(--primary-color);"></i>
                    Gen AI Academy
                </h1>
                <span class="badge">APAC Edition</span>
            </div>
            
            <nav class="sidebar-nav">
                <!-- CORE Section -->
                <div class="nav-section">
                    <div class="nav-category">CORE</div>
                    <a href="/" class="nav-item" id="navHome" data-page-id="home" style="display: none;">
                        <i class="nav-icon fas fa-home"></i>
                        <span>Home</span>
                    </a>
                    <a href="/dashboard" class="nav-item" id="navDashboard" data-page-id="dashboard" style="display: none;">
                        <i class="nav-icon fas fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                </div>
                
                <!-- DATA Section -->
                <div class="nav-section">
                    <div class="nav-category">DATA</div>
                    <a href="/profiles" class="nav-item" id="navProfiles" data-page-id="profiles" style="display: none;">
                        <i class="nav-icon fas fa-user-circle"></i>
                        <span>Profiles</span>
                    </a>
                    <a href="/skill-lab-credits" class="nav-item" id="navSkillLabCredits" data-page-id="skill_lab_credits" style="display: none;">
                        <i class="nav-icon fas fa-award"></i>
                        <span>Skill Lab credits</span>
                    </a>
                    <a href="/book-of-business" class="nav-item" id="navBookOfBusiness" data-page-id="book_of_business" style="display: none;">
                        <i class="nav-icon fas fa-book-open"></i>
                        <span>Book of Business Registrations</span>
                    </a>
                    <a href="/skilllab-submission" class="nav-item" id="navSkillLabSubmission" data-page-id="skilllab_submission" style="display: none;">
                        <i class="nav-icon fas fa-clipboard-check"></i>
                        <span>Skill Lab Submissions</span>
                    </a>
                    <a href="/import" class="nav-item" id="navImport" data-page-id="import" style="display: none;">
                        <i class="nav-icon fas fa-file-upload"></i>
                        <span>Import Data</span>
                    </a>
                </div>
                
                <!-- ADMIN Section -->
                <div class="nav-section">
                    <div class="nav-category">ADMIN</div>
                    <a href="/users" class="nav-item" id="navUsers" data-page-id="users" style="display: none;">
                        <i class="nav-icon fas fa-users-cog"></i>
                        <span>User Management</span>
                    </a>
                </div>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar (shown when authenticated) -->
            <header class="top-bar" id="topBar">
                <div class="top-bar-content">
                    <button class="sidebar-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="top-bar-right">
                        <span class="user-info" id="userInfo">Loading...</span>
                        <button class="btn btn-sm btn-secondary" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </header>
            
            <!-- Public Header (shown on home page when not authenticated) -->
            <header class="public-header" id="publicHeader" style="display: none;">
                <div class="public-header-content">
                    <div class="public-header-logo">
                        <i class="fas fa-graduation-cap" style="margin-right: 8px; color: var(--primary-color);"></i>
                        <span>Gen AI Academy</span>
                        <span class="badge" style="margin-left: 8px;">APAC Edition</span>
                    </div>
                    <a href="/login" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                </div>
            </header>
            
            <!-- Page Content (Premium theme: liquid background + container) -->
            <div class="page-content">
                <div class="theme-premium">
                    <div class="liquid-background">
                        <div class="liquid-blob blob-1"></div>
                        <div class="liquid-blob blob-2"></div>
                        <div class="liquid-blob blob-3"></div>
                    </div>
                    <div class="theme-container">
                        {% block content %}{% endblock %}
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="/static/js/auth.js"></script>
    <script>
        // Initialize mobile sidebar state
        function initMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isMobile = window.innerWidth <= 640;
            
            // Ensure sidebar starts in correct state
            if (isMobile) {
                // On mobile, start collapsed (hidden)
                sidebar.classList.add('collapsed');
                if (overlay) overlay.classList.remove('active');
            } else {
                // On desktop, start visible
                sidebar.classList.remove('collapsed');
                if (overlay) overlay.classList.remove('active');
            }
        }
        
        // Check authentication and role on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize mobile sidebar
            initMobileSidebar();
            
            const user = getCurrentUser();
            const token = getAuthToken();
            const currentPath = window.location.pathname;
            
            // Public pages that don't require authentication
            const publicPages = ['/login', '/'];
            
            // If no user or token, redirect to login (but not if on public pages)
            if (!user || !token) {
                if (!publicPages.includes(currentPath)) {
                    window.location.href = '/login';
                    return;
                } else {
                    // On public pages, hide authenticated UI elements and show public header
                    const sidebar = document.getElementById('sidebar');
                    const topBar = document.getElementById('topBar');
                    const publicHeader = document.getElementById('publicHeader');
                    if (sidebar) sidebar.style.display = 'none';
                    if (topBar) topBar.style.display = 'none';
                    if (publicHeader && currentPath === '/') {
                        publicHeader.style.display = 'block';
                    }
                    // Adjust main content margin for full-width on home page
                    const mainContent = document.querySelector('.main-content');
                    if (mainContent && currentPath === '/') {
                        mainContent.style.marginLeft = '0';
                    }
                    return;
                }
            } else {
                // Hide public header when authenticated
                const publicHeader = document.getElementById('publicHeader');
                if (publicHeader) publicHeader.style.display = 'none';
            }
            
            // Verify token is still valid by calling /api/auth/me
            fetch('/api/auth/me', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (!response.ok) {
                    // Token invalid, redirect to login (unless on public page)
                    if (!publicPages.includes(currentPath)) {
                        logout();
                    }
                    throw new Error('Session expired');
                }
                return response.json();
            })
            .then(data => {
                // Update user info
                const userInfoEl = document.getElementById('userInfo');
                if (userInfoEl) {
                    userInfoEl.textContent = data.user.name + ' (' + data.user.role + ')';
                }
                
                // Show/hide menu items based on allowed_pages (or role if not set)
                const allowed = data.user.allowed_pages;
                const role = data.user.role;
                document.querySelectorAll('.nav-item[data-page-id]').forEach(function(el) {
                    const pageId = el.getAttribute('data-page-id');
                    let show = false;
                    if (allowed && Array.isArray(allowed) && allowed.length > 0) {
                        show = allowed.indexOf(pageId) !== -1;
                    } else {
                        if (pageId === 'home' || pageId === 'dashboard' || pageId === 'profiles' || pageId === 'skill_lab_credits' || pageId === 'book_of_business' || pageId === 'skilllab_submission') show = true;
                        if (pageId === 'import' && (role === 'admin' || role === 'editor')) show = true;
                        if (pageId === 'users' && role === 'admin') show = true;
                    }
                    el.style.display = show ? 'block' : 'none';
                });
            })
            .catch(error => {
                console.error('Auth check failed:', error);
                // Only redirect if not on a public page
                if (!publicPages.includes(currentPath)) {
                    // Already handled by logout() in catch
                }
            });
        });
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isMobile = window.innerWidth <= 640;
            
            if (isMobile) {
                // On mobile, toggle sidebar and overlay with smooth animation
                const isCollapsed = sidebar.classList.contains('collapsed');
                
                if (isCollapsed) {
                    // Open sidebar - slide in
                    requestAnimationFrame(() => {
                        sidebar.classList.remove('collapsed');
                        if (overlay) {
                            overlay.classList.add('active');
                        }
                        document.body.style.overflow = 'hidden';
                    });
                } else {
                    // Close sidebar - slide out
                    closeSidebar();
                }
            } else {
                // On desktop, just toggle with smooth animation
                requestAnimationFrame(() => {
                    sidebar.classList.toggle('collapsed');
                    if (overlay) overlay.classList.remove('active');
                });
            }
        }
        
        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            // Slide out animation
            sidebar.classList.add('collapsed');
            if (overlay) {
                overlay.classList.remove('active');
            }
            document.body.style.overflow = '';
        }
        
        // Close sidebar on navigation click (mobile) with smooth animation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                const sidebar = document.getElementById('sidebar');
                const isMobile = window.innerWidth <= 640;
                
                if (isMobile) {
                    // Allow navigation to happen, then smoothly close sidebar
                    setTimeout(() => {
                        closeSidebar();
                    }, 200);
                }
            });
        });
        
        // Handle window resize
        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isMobile = window.innerWidth <= 640;
            
            if (!isMobile) {
                // On desktop, ensure sidebar is visible and overlay is hidden
                sidebar.classList.remove('collapsed');
                if (overlay) overlay.classList.remove('active');
                document.body.style.overflow = '';
            } else {
                // On mobile, ensure sidebar is hidden by default
                if (!sidebar.classList.contains('collapsed')) {
                    closeSidebar();
                }
            }
        });
        
        // Prevent sidebar from closing when clicking inside it
        document.getElementById('sidebar').addEventListener('click', function(e) {
            e.stopPropagation();
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
