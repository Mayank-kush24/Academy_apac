{% extends "base.html" %}

{% block title %}Users - Gen AI Academy APAC{% endblock %}

{% block content %}
<div class="users-page theme-page">
    <div class="dashboard-header">
        <div class="header-content">
            <div>
                <h1 class="page-title">User Management</h1>
                <p class="page-subtitle">Manage app users, roles, and access</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary action-btn" onclick="openCreateModal()">
                    <i class="fas fa-user-plus"></i> Add User
                </button>
            </div>
        </div>
    </div>

    <div class="glass-card chart-primary">
        <div class="table-container">
        <table class="data-table" id="usersTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr>
                    <td colspan="6" class="text-center">Loading...</td>
                </tr>
            </tbody>
        </table>
        </div>
    </div>
</div>

<!-- Create/Edit Modal -->
<div id="userModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Add User</h2>
            <button class="modal-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="userForm" class="modal-body">
            <input type="hidden" id="userId" name="userId">
            
            <div class="form-group">
                <label for="userName">Name *</label>
                <input type="text" id="userName" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="userEmail">Email *</label>
                <input type="email" id="userEmail" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="userPassword">Password <span id="passwordRequired">*</span></label>
                <input type="password" id="userPassword" name="password" placeholder="Leave blank to keep current">
            </div>
            
            <div class="form-group">
                <label for="userRole">Role *</label>
                <select id="userRole" name="role" required>
                    <option value="viewer">Viewer</option>
                    <option value="editor">Editor</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="userStatus">Status *</label>
                <select id="userStatus" name="status" required>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="useRoleAccess" name="useRoleAccess" checked>
                    Use role-based access (default pages for this role)
                </label>
                <p class="form-hint">Uncheck to choose which pages this user can see.</p>
            </div>
            
            <div class="form-group" id="pageAccessGroup" style="display: none;">
                <label>Page access</label>
                <div id="pageAccessCheckboxes" class="page-access-list"></div>
            </div>
            
            <div id="formError" class="error-message" style="display: none;"></div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save
                </button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/users.js?v={{ v }}"></script>
{% endblock %}
