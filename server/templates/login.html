<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Login - Gen AI Academy APAC</title>
    {% set v = v|default(1) %}
    <link rel="icon" href="{{ url_for('static_files', filename='images/hero-panels.png') }}?v={{ v }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static_files', filename='images/hero-panels.png') }}?v={{ v }}">
    <link rel="stylesheet" href="{{ url_for('static_files', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static_files', filename='css/dashboard-premium.css') }}">
    <link rel="stylesheet" href="{{ url_for('static_files', filename='css/liquid-glass.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=Google+Sans+Display:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-page theme-premium-login">
    <div class="liquid-background liquid-background--login">
        <div class="liquid-blob blob-1"></div>
        <div class="liquid-blob blob-2"></div>
        <div class="liquid-blob blob-3"></div>
    </div>
    <div class="login-container">
        <div class="login-card glass-card">
            <div class="login-header">
                <h1>
                    <i class="fas fa-graduation-cap" style="margin-right: 12px; color: var(--primary-color); font-size: 36px;"></i>
                    Gen AI Academy
                </h1>
                <span class="badge">APAC Edition</span>
            </div>
            <p class="login-subtitle">Sign in to continue your journey</p>
            {% if cdi_portal_dashboard_url %}
            <p style="text-align:center;margin:0 0 1rem;">
                <a href="{{ cdi_portal_dashboard_url }}" class="btn btn-secondary btn-sm" style="text-decoration:none;display:inline-flex;align-items:center;gap:0.35rem;" title="Return to the Hack2skill CDI portal">
                    <i class="fas fa-th-large"></i> Back to CDI
                </a>
            </p>
            {% endif %}
            <form id="loginForm" class="login-form" action="#" method="post">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                </div>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <button type="button" id="loginSubmitBtn" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
        </div>
    </div>
    <!-- Cache-bust so browser always gets latest login behavior -->
    <script>window.__APP_SCRIPT_ROOT__ = {{ (request.script_root or '') | tojson }};</script>
    <script>window.__CDI_PORTAL_LOGIN_URL__ = {{ (cdi_portal_login_url|default('')) | tojson }};</script>
    <script src="{{ url_for('static_files', filename='js/auth.js') }}?v={{ v }}"></script>
    <style>
    @media (max-width: 768px) {
        .login-page.theme-premium-login {
            padding: 16px;
            overflow-x: hidden;
        }
        .login-container {
            width: 100%;
            max-width: 100%;
            padding: 0;
        }
        .login-card {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 28px 20px;
            box-sizing: border-box;
        }
        .login-header h1 {
            font-size: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            text-align: center;
            gap: 8px;
        }
        .login-header h1 i {
            font-size: 28px !important;
            margin-right: 0 !important;
        }
        .login-form .form-group input {
            width: 100%;
            font-size: 16px;
            min-height: 44px;
            box-sizing: border-box;
        }
        .login-form .btn-block,
        .login-form .btn-primary {
            width: 100%;
            min-height: 48px;
            justify-content: center;
        }
        .login-page .btn-secondary {
            width: 100%;
            justify-content: center;
            min-height: 44px;
        }
    }
    </style>
</body>
</html>
